    <script>
      // Gracefully handle Vite dev HMR websocket notices in cloud proxy environments
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          ((event.reason.message && event.reason.message.includes('WebSocket')) ||
           (event.reason.stack && event.reason.stack.includes('@vite/client')))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && event.message.includes('WebSocket')) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
    </script>
